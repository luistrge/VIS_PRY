<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">COVID-19, Wealth and Mortality</title>
  <desc id="description">Repository banner for an interactive 2020 global analytics dashboard built with R Shiny and Plotly.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061826"/>
      <stop offset="0.55" stop-color="#0b2433"/>
      <stop offset="1" stop-color="#102a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1180" cy="90" r="270" fill="url(#glow)"/>
  <circle cx="112" cy="390" r="190" fill="#22c55e" opacity=".04"/>
  <path d="M0 340 C210 285 320 390 530 328 S880 250 1060 320 S1260 372 1400 310" fill="none" stroke="#22d3ee" stroke-opacity=".08" stroke-width="2"/>

