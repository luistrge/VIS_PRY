  <text x="74" y="177" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="750">COVID-19, Wealth</text>
  <text x="74" y="237" fill="url(#accent)" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="750">&amp; Mortality</text>
  <text x="76" y="279" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="20">Interactive cross-country exploration with R Shiny + Plotly</text>

